[package]
name = "fastcgi"
version = "0.1.0"
edition = "2024"
authors = ["Lut99"]
repository = "https://github.com/Lut99/fastcgi-rs"
license = "Apache-2.0"
description = "A Rust implementation of the FastCGI process control protocol."


[[example]]
name = "php"
path = "examples/php/main.rs"
required-features = []


[dependencies]
log = { version = "0.4.0", optional = true }
parking_lot = { version = "0.12.0" }
thiserror = "2.0.0"
tokio = { version = "1.52.0", default-features = false, features = ["io-util"] }


[dev-dependencies]
clap = { version = "4.6.0", features = ["derive"] }
error-trace = "4.0.0"
humanlog = { git = "https://github.com/Lut99/humanlog-rs" }
log = "0.4.0"
tokio = { version = "1.52.0", default-features = false, features = ["macros", "net", "rt"] }


[features]
default = []

log = ["dep:log"]
